<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Oswald:wght@200..700&family=Outfit:wght@100..900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <title>Guess the Number</title>
</head>
<body>
    <div class="container">
        <img src="photes/star.png" alt="Star" class="star" id="leftstar">
    <div class="pixel-box">
  <h2 class="tit1">Guess the Number from 1 to 10</h2>
  <div class="spinner">
    <button id="minus">-</button>
    <span id="number">1</span>
    <button id="plus">+</button>
</div>
   <button id="check">Check</button> 
   <div id="resultCont"></div>
   <button id="hint" style="display: none;">Hint</button>
   <div id="life">
    <img src="photes/heart.png" alt="heart" class="heart">
    <img src="photes/heart.png" alt="heart" class="heart">
    <img src="photes/heart.png" alt="heart" class="heart">
     <button id="restart" style="display:none;">Restart</button>
   </div>
</div>
<img src="photes/star.png" alt="Star" class="star" id="rightstar">
    </div>
<div class="des">
    <h2 class="how">How To Play The Game?</h2>
    <p>1. The computer generates a random number between 1 and 10</p>
    <p>2. Try to guess the number.</p>
    <p>3. You have 3 attempts to guess the number.</p>
</div>
<div id="hintBox" class="hint-box"></div>
<script src="script.js"></script>
</body>
</html>
